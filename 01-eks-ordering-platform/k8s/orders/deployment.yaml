apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ordering
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: ordering-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: ordering-platform
    spec:
      # Must exceed httpx.DrainDelay + httpx.ShutdownTimeout (5s + 10s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders
      containers:
        - name: orders
          image: 188050967390.dkr.ecr.us-east-1.amazonaws.com/ordering-platform/orders:322a526
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # The service defaults to these, but naming them here makes the
            # dependency graph visible in the manifest rather than only in code.
            - name: MENU_URL
              value: http://menu.ordering.svc.cluster.local
            - name: PAYMENTS_URL
              value: http://payments-mock.ordering.svc.cluster.local
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
