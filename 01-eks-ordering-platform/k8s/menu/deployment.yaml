apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
  namespace: ordering
  labels:
    app.kubernetes.io/name: menu
    app.kubernetes.io/part-of: ordering-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: menu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: menu
        app.kubernetes.io/part-of: ordering-platform
    spec:
      # The app drains for 5s after SIGTERM, then gets 10s to finish in-flight
      # requests, so this must stay above 15s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # 65532 is the distroless "nonroot" user. Stated numerically so the
        # kubelet can verify it without resolving a name inside the image.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Keep the two replicas on different nodes so losing one spot instance
      # cannot take out the whole service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: menu
      containers:
        - name: menu
          image: 188050967390.dkr.ecr.us-east-1.amazonaws.com/ordering-platform/menu:322a526
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # No CPU limit on purpose: the request guarantees a floor, while a
              # limit would only add CFS throttling on a latency-sensitive path.
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
