name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs write access or AWS credentials; the image is built but
# never pushed. Publishing lives in a separate workflow with its own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  AWS_REGION: us-east-1
  ECR_NAMESPACE: ordering-platform
  # Not a secret. Authentication is OIDC, and the role's trust policy only
  # accepts this repository on refs/heads/main.
  AWS_ROLE_ARN: arn:aws:iam::188050967390:role/ordering-platform-github-actions

jobs:
  go:
    name: go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Extend as orders and payments-mock land.
        service: [menu]
    defaults:
      run:
        working-directory: 01-eks-ordering-platform/app/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # The services are stdlib-only, so there is no go.sum to key a cache
          # on and nothing to download.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters here: readiness is flipped from the signal handler while
      # requests are being served.
      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage report
        run: go tool cover -func=coverage.out

      - name: build
        run: go build ./...

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"

      - name: fmt
        run: terraform fmt -check -recursive -diff 01-eks-ordering-platform/terraform

      # -backend=false so validation needs no S3 access or AWS credentials.
      # Stacks are discovered rather than listed, so a new one is covered the
      # day it is added.
      - name: validate every stack
        run: |
          set -euo pipefail
          failed=0
          for dir in 01-eks-ordering-platform/terraform/*/; do
            if ! compgen -G "${dir}*.tf" > /dev/null; then
              continue
            fi
            echo "::group::${dir}"
            if terraform -chdir="$dir" init -backend=false -input=false >/dev/null \
               && terraform -chdir="$dir" validate; then
              echo "ok"
            else
              echo "::error::terraform validate failed in ${dir}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init
          failed=0
          for dir in 01-eks-ordering-platform/terraform/*/; do
            if ! compgen -G "${dir}*.tf" > /dev/null; then
              continue
            fi
            echo "::group::${dir}"
            tflint --chdir="$dir" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Misconfiguration scan over Terraform and Kubernetes manifests.
      # Module exclusion and the accepted-findings file both come from
      # trivy.yaml, so a local run and this job behave identically.
      - name: trivy config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: 01-eks-ordering-platform
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: trivy filesystem (vulns and secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go]
    strategy:
      fail-fast: false
      matrix:
        service: [menu]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built for the architecture the EKS nodes actually run, and loaded
      # locally rather than pushed so the scan below has something to read.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: 01-eks-ordering-platform/app/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  publish:
    name: publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Everything must be green first: an image that failed its tests or its
    # vulnerability scan should never reach the registry.
    needs: [go, terraform, security, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service: [menu]
    # id-token is granted here and nowhere else, so this is the only job in the
    # workflow that can mint an OIDC token and assume the AWS role.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # No access keys anywhere: GitHub mints a short-lived OIDC token and AWS
      # exchanges it for temporary credentials.
      - name: assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: resolve image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ECR tags are immutable, so pushing a tag that already exists fails.
      # Re-running this workflow on an unchanged commit is normal, so treat an
      # existing tag as success rather than an error.
      - name: check whether this tag is already published
        id: exists
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if aws ecr describe-images \
               --repository-name "${ECR_NAMESPACE}/${SERVICE}" \
               --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "::notice::${SERVICE}:${TAG} already published, skipping"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - name: build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: 01-eks-ordering-platform/app/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`${IMAGE}\`"
            echo ""
            echo "Deploy with:"
            echo '```'
            echo "kubectl set image -n ordering deployment/${SERVICE} \\"
            echo "  ${SERVICE}=${IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
